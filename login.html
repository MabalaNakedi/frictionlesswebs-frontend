<!doctype html>
<html lang="en">
  <head>
<meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login — Frictionlesswebs</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-art">
        <a class="brand" href="index.html">
          <i>
            
          </i>
          frictionlesswebs
        </a>
        <h1>Back to<br>building.</h1>
        <p class="muted">
          Continue managing your projects, ideas and digital experiences.
        </p>
      </section>
      <section class="auth-panel">
        <form class="form-card" data-login>
          <div class="eyebrow">
            Client portal
          </div>
          <h2>Welcome back.</h2>
          <p class="muted">
            Sign in to your Frictionlesswebs account.
          </p>
          <div class="field">
            <label>Email</label>
            <input type="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" name="password" autocomplete="current-password" required>
          </div>
          <button class="btn primary full">
            Sign in →
          </button>
          <div class="notice" aria-live="polite">
            
          </div>
          <p class="muted">
            No account? 
            <a href="register.html" style="color:blue;">
              Create one</a>
            · <a href="index.html" style="color:blue;">
              Back home</a>
          </p>
        </form>
      </section>
    </main>
    <script src="config.js">
      
    </script>
    <script src="app.js">
      
    </script>
  </body>
</html>
