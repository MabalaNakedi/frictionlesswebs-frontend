<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Dashboard — Frictionlesswebs</title><link rel="stylesheet" href="style.css"></head><body class="sales-page"><header class="site-header"><div class="wrap nav"><a class="brand" href="index.html">frictionlesswebs</a><nav class="nav-links"><a href="index.html">Home</a><a href="sales-apply.html">Apply</a><a href="sales-login.html">Sales login</a></nav></div></header><main class="sales-shell"><div class="sales-wrap"><div id="top"></div><div class="sales-grid" id="kpis"></div><section class="sales-shell"><div class="sales-grid"><div class="sales-card"><h2>Your referral link</h2><p class="sales-muted">Share this with prospects. Their enquiry is automatically attributed to your Sales ID.</p><div class="sales-ref"><input id="ref" readonly><button class="sales-btn" id="copy">Copy</button></div></div><div class="sales-card"><h2>Submit a lead</h2><form class="sales-form" id="lead"><input name="businessName" placeholder="Business name *" required><div class="two"><input name="contactName" placeholder="Contact name"><input name="phone" placeholder="Phone / WhatsApp"></div><input name="email" type="email" placeholder="Email"><textarea name="serviceNeeded" placeholder="What do they need?"></textarea><textarea name="notes" placeholder="Notes"></textarea><label class="sales-check"><input type="checkbox" name="consent" required>The prospect has agreed to be contacted by Frictionlesswebs.</label><button class="sales-btn">Submit lead</button><div id="leadmsg" class="sales-hidden"></div></form></div></div></section><section id="agreement"></section><section class="sales-shell"><h2>Your leads</h2><div class="sales-table-wrap"><table class="sales-table"><thead><tr><th>Business</th><th>Status</th><th>Package</th><th>Sale</th><th>Commission</th><th>Paid?</th></tr></thead><tbody id="rows"></tbody></table></div></section><button class="sales-btn alt" id="logout">Log out</button></div></main><script src="config.js"></script><script src="sales-common.js"></script><script>
async function load(){try{const d=await salesApi('/api/sales/me');document.querySelector('#top').innerHTML=`<div class="sales-kicker">${d.person.sales_id}</div><h1>Welcome, ${d.person.first_name}.</h1><p class="sales-muted">Track your referrals, sales and commission here.</p>`;document.querySelector('#kpis').innerHTML=[['Leads',d.totals.leads],['Sales won',d.totals.won],['Earned',smoney(d.totals.earned)],['Pending',smoney(d.totals.pending)],['Paid',smoney(d.totals.paid)]].map(x=>`<div class="sales-card third"><div class="sales-label">${x[0]}</div><div class="sales-kpi">${x[1]}</div></div>`).join('');document.querySelector('#ref').value=d.referralLink;document.querySelector('#rows').innerHTML=d.leads.map(x=>`<tr><td>${x.business_name}</td><td>${x.status.replaceAll('_',' ')}</td><td>${x.package_name||'—'}</td><td>${x.sale_value?smoney(x.sale_value):'—'}</td><td>${x.commission_value?smoney(x.commission_value):'—'}</td><td>${x.commission_paid?'Yes':'No'}</td></tr>`).join('')||'<tr><td colspan="6">No leads yet.</td></tr>';if(!d.person.agreement_signed_at){document.querySelector('#agreement').innerHTML=`<div class="sales-card full"><div class="sales-kicker">Required</div><h2>Sales Representative Agreement</h2><div class="sales-agreement"><p><strong>Commission-based relationship.</strong> You act as an independent freelance sales representative. There is no fixed salary. Commission becomes payable only on qualifying sales after Frictionlesswebs receives the applicable client payment.</p><p>You may find prospects, explain approved packages, follow up and submit leads. You may not change prices, offer discounts, promise deadlines or custom functionality, negotiate payment terms, collect client payments into a personal account, or bind Frictionlesswebs to custom terms.</p><p>Custom projects including ecommerce, online payments, customer accounts, dashboards, complex bookings, databases, subscriptions, marketplaces and unusual integrations must be referred to Frictionlesswebs for quotation.</p><p>Lead ownership is determined from portal records and referral attribution. Duplicate, fraudulent or unconsented leads may be rejected.</p><p>The final production agreement should match the version reviewed for Frictionlesswebs.</p></div><form class="sales-form" id="sign"><input name="fullName" placeholder="Full name" required><input name="signature" placeholder="Type your full name as electronic signature" required><label class="sales-check"><input type="checkbox" name="accepted" required>I have read and accept the agreement.</label><button class="sales-btn">Sign agreement</button></form></div>`;document.querySelector('#sign').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),b=Object.fromEntries(f);b.accepted=!!f.get('accepted');await salesApi('/api/sales/sign-agreement',{method:'POST',body:JSON.stringify(b)});load()}}else document.querySelector('#agreement').innerHTML='<div class="sales-notice">Sales agreement signed ✓</div>'}catch(e){location='sales-login.html'}}
document.querySelector('#lead').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),b=Object.fromEntries(f);b.consent=!!f.get('consent');try{const d=await salesApi('/api/sales/leads',{method:'POST',body:JSON.stringify(b)});sflash(document.querySelector('#leadmsg'),d.message);e.target.reset();load()}catch(x){sflash(document.querySelector('#leadmsg'),x.message,true)}};
document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(document.querySelector('#ref').value);document.querySelector('#logout').onclick=()=>{localStorage.removeItem('fw_sales_token');location='sales-login.html'};load();
</script></body></html>
