<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Dashboard — Frictionlesswebs
    </title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="wrap nav">
      <a class="brand" href="index.html">
        <i>
          
        </i>
        frictionlesswebs
      </a>
      <nav class="links" style="display:flex">
        <a data-admin-link hidden href="admin.html">Admin</a>
        <button class="pill" data-logout>
          Log out
        </button>
      </nav>
    </header>
    <main class="wrap dashboard">
      <div class="eyebrow">
        Client portal
      </div>
      <h1>Hey, 
        <span data-user>client</span>.
      </h1>
      <p class="muted">
        Your account is working. This starter dashboard is ready to be expanded with project status, files, invoices or messages.
      </p>
      <div class="cards">
        <div class="card">
          <small class="muted">PROJECTS</small>
          <h2>0 active</h2>
        </div>
        <div class="card">
          <small class="muted">MESSAGES</small>
          <h2>Portal ready</h2>
        </div>
        <div class="card">
          <small class="muted">STATUS</small>
          <h2>Account active</h2>
        </div>
      </div>
    </main>
    <script src="js/config.js">
      
    </script>
    <script src="js/app.js">
      
    </script>
  </body>
</html>
