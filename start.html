<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Start a Project — Frictionlesswebs</title><link rel="stylesheet" href="style.css"></head><body class="sales-page"><header class="site-header"><div class="wrap nav"><a class="brand" href="index.html">frictionlesswebs</a><nav class="nav-links"><a href="index.html">Home</a><a href="sales-apply.html">Apply</a><a href="sales-login.html">Sales login</a></nav></div></header><main class="sales-shell"><div class="sales-wrap sales-grid"><section class="sales-card"><div class="sales-kicker">Start your website</div><h1>Tell us what you need.</h1><p class="sales-muted">If a Frictionlesswebs representative sent you here, their referral is recorded automatically.</p></section><section class="sales-card"><form class="sales-form" id="refForm"><input type="hidden" name="ref"><input name="businessName" placeholder="Business name *" required><div class="two"><input name="contactName" placeholder="Your name"><input name="phone" placeholder="Phone / WhatsApp"></div><input name="email" type="email" placeholder="Email"><textarea name="serviceNeeded" placeholder="What kind of website or redesign do you need?"></textarea><textarea name="notes" placeholder="Anything else we should know?"></textarea><label class="sales-check"><input type="checkbox" name="consent" required>I agree that Frictionlesswebs may contact me about this enquiry.</label><button class="sales-btn">Request a quote</button><div id="msg" class="sales-hidden"></div></form></section></div></main><script src="config.js"></script><script src="sales-common.js"></script><script>
