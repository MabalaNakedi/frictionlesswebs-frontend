<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Admin — Frictionlesswebs</title><link rel="stylesheet" href="style.css"></head><body class="sales-page"><header class="site-header"><div class="wrap nav"><a class="brand" href="index.html">frictionlesswebs</a><nav class="nav-links"><a href="index.html">Home</a><a href="sales-apply.html">Apply</a><a href="sales-login.html">Sales login</a></nav></div></header><main class="sales-shell"><div class="sales-wrap"><section id="adminLogin" class="sales-card" style="max-width:560px;margin:auto"><div class="sales-kicker">Admin</div><h1>Sales portal.</h1><p class="sales-muted">Use the same Frictionlesswebs admin account as your existing admin dashboard.</p><form class="sales-form" id="adminForm"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button class="sales-btn">Sign in</button><div id="msg" class="sales-hidden"></div></form></section><section id="panel" class="sales-hidden"><div class="sales-kicker">Frictionlesswebs</div><h1>Sales administration.</h1><h2>Applicants</h2><div class="sales-grid" id="apps"></div><div class="sales-shell"><h2>Lead pipeline</h2><div class="sales-table-wrap"><table class="sales-table"><thead><tr><th>Lead</th><th>Salesperson</th><th>Status</th><th>Package</th><th>Value</th><th>Repeat client</th><th>Client paid</th><th>Commission</th><th>Commission paid</th><th></th></tr></thead><tbody id="leads"></tbody></table></div></div><button class="sales-btn alt" id="logout">Log out</button></section></div></main><script src="config.js"></script><script src="sales-common.js"></script><script>
async function loadAdmin(){try{const [a,l]=await Promise.all([salesApi('/api/admin/sales/applicants',{admin:true}),salesApi('/api/admin/sales/leads',{admin:true})]);document.querySelector('#adminLogin').classList.add('sales-hidden');document.querySelector('#panel').classList.remove('sales-hidden');document.querySelector('#apps').innerHTML=a.applicants.map(x=>`<div class="sales-card"><div class="sales-label">${x.status} ${x.sales_id?'· '+x.sales_id:''}</div><h3>${x.first_name} ${x.surname}</h3><p class="sales-muted">Age ${x.age} · ${x.city||''} ${x.province||''}<br>${x.email}<br>${x.whatsapp}</p><p>${x.motivation}</p><p class="sales-muted">${x.experience||'No sales experience supplied.'}</p><div class="sales-actions"><button class="sales-btn" onclick="setStatus(${x.id},'approved')">Approve</button><button class="sales-btn alt" onclick="setStatus(${x.id},'rejected')">Reject</button></div></div>`).join('')||'<p>No applications yet.</p>';document.querySelector('#leads').innerHTML=l.leads.map(x=>`<tr data-id="${x.id}"><td><b>${x.business_name}</b><br><small>${x.contact_name||''}</small></td><td>${x.sales_id||'Direct'}<br><small>${x.first_name||''} ${x.surname||''}</small></td><td><select class="st">${['submitted','contacted','qualified','quote_sent','client_accepted','payment_received','sale_confirmed','lost'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></td><td><select class="pk"><option value="">—</option>${['Starter','Business','Business Plus','Pro','Advanced','Custom'].map(v=>`<option ${x.package_name===v?'selected':''}>${v}</option>`).join('')}</select></td><td><input class="val" type="number" value="${x.sale_value||''}"></td><td><input class="paid" type="checkbox" ${x.payment_received?'checked':''}></td><td><input class="cp" type="checkbox" ${x.commission_paid?'checked':''}></td><td><button class="sales-btn" onclick="saveLead(${x.id})">Save</button></td></tr>`).join('')||'<tr><td colspan="8">No leads yet.</td></tr>'}catch(e){if(localStorage.getItem('fw_token'))sflash(document.querySelector('#msg'),e.message,true)}}
document.querySelector('#adminForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(`${SALES_API}/api/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to sign in');if(d.user.role!=='admin')throw new Error('Admin access required.');localStorage.setItem('fw_token',d.token);loadAdmin()}catch(x){sflash(document.querySelector('#msg'),x.message,true)}};
async function setStatus(id,status){await salesApi('/api/admin/sales/applicants/'+id,{method:'PATCH',body:JSON.stringify({status}),admin:true});loadAdmin()}
async function saveLead(id){const r=document.querySelector(`tr[data-id="${id}"]`),b={status:r.querySelector('.st').value,packageName:r.querySelector('.pk').value||null,saleValue:r.querySelector('.val').value,repeatSale:r.querySelector('.repeat').checked,paymentReceived:r.querySelector('.paid').checked,commissionPaid:r.querySelector('.cp').checked};await salesApi('/api/admin/sales/leads/'+id,{method:'PATCH',body:JSON.stringify(b),admin:true});loadAdmin()}
document.querySelector('#logout').onclick=()=>{localStorage.removeItem('fw_token');location.reload()};if(localStorage.getItem('fw_token'))loadAdmin();
</script></body></html>
