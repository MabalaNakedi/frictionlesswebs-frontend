<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Login — Frictionlesswebs</title><link rel="stylesheet" href="style.css"></head><body class="sales-page"><header class="site-header"><div class="wrap nav"><a class="brand" href="index.html">frictionlesswebs</a><nav class="nav-links"><a href="index.html">Home</a><a href="sales-apply.html">Apply</a><a href="sales-login.html">Sales login</a></nav></div></header><main class="sales-shell"><div class="sales-wrap sales-grid"><section class="sales-card"><div class="sales-kicker">First time?</div><h1>Activate.</h1><p class="sales-muted">Once Frictionlesswebs approves your application, enter your Sales ID and application email to create a password.</p><form class="sales-form" id="activate"><input name="salesId" placeholder="Sales ID — e.g. FW-S0007" required><input name="email" type="email" placeholder="Application email" required><input name="password" type="password" minlength="8" placeholder="Create password (8+ characters)" required><button class="sales-btn">Activate account</button><div id="amsg" class="sales-hidden"></div></form></section><section class="sales-card"><div class="sales-kicker">Welcome back</div><h1>Sign in.</h1><form class="sales-form" id="login"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="sales-btn">Sign in</button><div id="lmsg" class="sales-hidden"></div></form></section></div></main><script src="config.js"></script><script src="sales-common.js"></script><script>
document.querySelector('#activate').onsubmit=async e=>{e.preventDefault();try{const d=await salesApi('/api/sales/activate',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});sflash(document.querySelector('#amsg'),d.message)}catch(x){sflash(document.querySelector('#amsg'),x.message,true)}};
document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{const d=await salesApi('/api/sales/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});localStorage.setItem('fw_sales_token',d.token);location='sales-dashboard.html'}catch(x){sflash(document.querySelector('#lmsg'),x.message,true)}};
</script></body></html>
